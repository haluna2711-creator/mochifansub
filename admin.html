<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Tiệm Bánh Mochi</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body style="display:grid;place-items:center;min-height:100svh;padding:1rem;background:#fbe3e6">
<div class="card">
  <section id="aLogin"><h2>Admin</h2>
    <form id="fa"><label for="aE">Email</label><input id="aE" type="email" required>
    <label for="aP">Mật khẩu</label><input id="aP" type="password" required><button class="btn">Đăng nhập</button></form></section>
  <section id="aPanel" hidden><h2>Đổi nền trang chủ</h2>
    <p class="muted">Chọn ảnh JPG (tối đa 5MB).</p>
    <img id="prev" alt="" style="width:100%;border-radius:12px;margin-bottom:.5rem" hidden>
    <input id="file" type="file" accept="image/jpeg,.jpg,.jpeg">
    <button class="btn" id="up">Lưu nền mới</button>
    <button class="btn" id="out" style="background:#8a6f7a">Đăng xuất</button></section>
  <div class="msg" id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const C=window.MOCHI, sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY), $=i=>document.getElementById(i);
const msg=(t,ok)=>{const m=$("msg");m.className="msg "+(ok?"ok":"err");m.textContent=t};
async function gate(){
  const {data:{session}}=await sb.auth.getSession();
  let admin=false;
  if(session){const {data}=await sb.rpc("is_admin");admin=!!data;}
  $("aLogin").hidden=admin;$("aPanel").hidden=!admin;
  if(session&&!admin)msg("Tài khoản này không có quyền admin.");
}
$("fa").onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$("aE").value,password:$("aP").value});
  error?msg("Đăng nhập thất bại."):gate();};
$("out").onclick=async()=>{await sb.auth.signOut();gate();};
$("file").onchange=e=>{const f=e.target.files[0];if(f){$("prev").src=URL.createObjectURL(f);$("prev").hidden=false;}};
$("up").onclick=async()=>{
  const f=$("file").files[0];
  if(!f||!/jpe?g$/i.test(f.name)||f.type!=="image/jpeg")return msg("Hãy chọn file JPG.");
  if(f.size>5*1024*1024)return msg("Ảnh vượt quá 5MB.");
  const path=`bg-${Date.now()}.jpg`;
  const {error}=await sb.storage.from("backgrounds").upload(path,f,{contentType:"image/jpeg"});
  if(error)return msg("Tải ảnh lỗi: "+error.message);
  const {data}=sb.storage.from("backgrounds").getPublicUrl(path);
  const {error:e2}=await sb.from("site_settings").upsert({key:"background_url",value:data.publicUrl});
  e2?msg("Lưu cài đặt lỗi: "+e2.message):msg("Đã đổi nền. Tải lại trang chủ để xem.",true);
};
gate();
</script></body></html>
